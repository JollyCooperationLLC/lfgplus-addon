# Every push to main: run the specs in real Lua 5.1 with full line and branch coverage, then package the addon with a
# timestamp version (UTC, year.month.day.hourminutesecond) and publish it as a GitHub release. Actions are pinned to a
# full commit SHA, as the organisation requires; the comment names the release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, in the order the pushes came.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Specs and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # busted.sh finds no local Lua 5.1 on the runner and builds test/docker's image instead.
      - name: Run every spec with line and branch coverage
        run: bash coverage.sh

  release:
    name: Package and publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pick the version
        id: version
        run: echo "version=$(date -u +%Y.%m.%d.%H%M%S)" >> "$GITHUB_OUTPUT"
      - name: Package
        id: package
        run: echo "zip=$(bash tools/package.sh "${{ steps.version.outputs.version }}")" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          gh release create "v$VERSION" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LFG+ $VERSION" \
            --generate-notes
